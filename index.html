<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=10a813be-a7a0-42f1-bea4-223d75c85f23
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow YT Premium Gen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #000 0%, #200000 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 0, 0, 0.5);
            border-radius: 50%;
            box-shadow: 0 0 20px #ff0000;
            animation: drift 20s infinite linear;
        }

        @keyframes drift {
            0% {
                transform: translate(-50vw, 100vh) rotate(0deg);
                opacity: 0;
            }

            25% {
                opacity: 0.7;
            }

            75% {
                opacity: 0.7;
            }

            100% {
                transform: translate(50vw, -50vh) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 50px 20px;
            max-width: 900px;
            width: 95%;
        }

        h1 {
            font-family: 'Roboto', sans-serif;
            font-size: 5rem;
            color: #ff0000;
            text-shadow: 0 0 30px #ff0000, 0 0 60px #ff3333;
            margin-bottom: 15px;
            animation: pulseRed 2.5s infinite alternate;
        }

        @keyframes pulseRed {
            from {
                text-shadow: 0 0 20px #ff0000;
            }

            to {
                text-shadow: 0 0 70px #ff0000, 0 0 120px #ff3333;
            }
        }

        .subtitle {
            font-size: 1.6rem;
            color: #ddd;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-bottom: 50px;
        }

        input {
            width: 250px;
            padding: 20px;
            font-size: 1.6rem;
            text-align: center;
            border: 3px solid #ff0000;
            border-radius: 70px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            transition: all 0.4s;
        }

        input:focus {
            outline: none;
            border-color: #ff3333;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            transform: scale(1.06);
        }

        button.main {
            background: linear-gradient(45deg, #ff0000, #ff3333);
            color: #fff;
            font-weight: 700;
            border: none;
            padding: 20px 70px;
            font-size: 1.5rem;
            border-radius: 70px;
            cursor: pointer;
            transition: all 0.5s;
            box-shadow: 0 15px 40px rgba(255, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        button.main:hover {
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 25px 70px rgba(255, 0, 0, 0.8);
        }

        button.main::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.7s, height 0.7s;
        }

        button.main:active::after {
            width: 400px;
            height: 400px;
        }

        #lista {
            background: rgba(30, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 35px;
            margin: 50px 0;
            border: 2px solid rgba(255, 0, 0, 0.4);
            max-height: 450px;
            overflow-y: auto;
        }

        .link {
            background: rgba(0, 0, 0, 0.7);
            padding: 18px 25px;
            margin: 15px 0;
            border-radius: 15px;
            font-size: 1.15rem;
            word-break: break-all;
            border-left: 6px solid #ff0000;
            opacity: 0;
            transform: translateX(40px);
            animation: slideInRight 0.8s forwards;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
        }

        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #111;
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s;
        }

        .action-btn:hover {
            background: #ff0000;
            color: #000;
        }

        footer {
            margin-top: 70px;
            color: #666;
            font-size: 1.1rem;
        }

        footer strong {
            color: #ff0000;
        }
    </style>
</head>

<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <h1>Snow YT Premium Gen</h1>
        <p class="subtitle">Gerador de Links YouTube Premium (1 mês free)</p>

        <div class="input-group">
            <input type="number" id="quantidade" value="20" min="1" max="500" placeholder="Quantos links?">
            <button class="main" onclick="gerarLinks()">GERAR LINKS</button>
        </div>

        <div id="lista"></div>

        <div class="actions">
            <button class="action-btn" onclick="copiarTodos()">Copiar Todos</button>
            <button class="action-btn" onclick="baixarTxt()">Baixar TXT</button>
        </div>

        <footer>
            By <strong>Snow</strong> 🔥
        </footer>
    </div>

    <script>
        const base = "https://www.youtube.com/premium?utm_source=yt_brand&utm_medium=";

        function gerarCodigo() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let code = "";
            for (let i = 0; i < 15; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            return code;
        }

        function gerarLinks() {
            const qtd = parseInt(document.getElementById("quantidade").value) || 20;
            let html = "";
            const links = [];

            for (let i = 0; i < qtd; i++) {
                const codigo = gerarCodigo();
                const link = base + codigo;
                links.push(link);
                html += `<div class="link" style="animation-delay: ${i * 0.09}s;">${link}</div>`;
            }

            document.getElementById("lista").innerHTML = html;
            window.linksGerados = links;
        }

        function copiarTodos() {
            if (!window.linksGerados?.length) return alert("Gera os links primeiro po!");
            navigator.clipboard.writeText(window.linksGerados.join("\n"));
            alert("Links copiados! Bora colar 🔥");
        }

        function baixarTxt() {
            if (!window.linksGerados?.length) return alert("Gera os links primeiro po!");
            const blob = new Blob([window.linksGerados.join("\n")], {type: "text/plain"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "snow-yt-premium-links.txt";
            a.click();
        }

        // Partículas vermelhas
        function criarParticulas() {
            const div = document.getElementById("particles");
            for (let i = 0; i < 35; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                p.style.width = p.style.height = Math.random() * 7 + 4 + "px";
                p.style.left = Math.random() * 100 + "vw";
                p.style.top = Math.random() * 100 + "vh";
                p.style.animationDelay = Math.random() * 10 + "s";
                p.style.animationDuration = Math.random() * 25 + 15 + "s";
                div.appendChild(p);
            }
        }
        criarParticulas();
    </script>
</body>

</html>
